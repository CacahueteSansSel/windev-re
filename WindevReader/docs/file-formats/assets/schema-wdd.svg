<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 285" role="img" aria-labelledby="title desc">
<title id="title">Lecture du schéma WDD</title><desc id="desc">Lire le préfixe, inverser la transformation, décompresser, reconstruire H et vérifier son checksum avant de suivre ses pointeurs.</desc>
<rect width="1000" height="285" rx="16" fill="#f8fafc"/>
<style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#15243b}.title{font-size:23px;font-weight:700}.label{font-size:17px;font-weight:650}.small{font-size:14px}.note{font-size:15px}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<text x="28" y="38" class="title">Du WDD stocké au schéma exploitable</text><rect x="28" y="80" width="210" height="104" rx="10" fill="#dbeafe" stroke="#64748b" stroke-width="1.2"/><text x="44" y="109" class="label">Section du WDD</text><text x="44" y="134" class="small">Préfixe 60 00 1D 06</text><text x="44" y="159" class="small">Corps transformé</text><rect x="273" y="80" width="210" height="104" rx="10" fill="#fef3c7" stroke="#64748b" stroke-width="1.2"/><text x="289" y="109" class="label">Transformation</text><text x="289" y="134" class="small">Inverser les octets</text><text x="289" y="159" class="small">Enveloppe LZW</text><rect x="518" y="80" width="210" height="104" rx="10" fill="#e0e7ff" stroke="#64748b" stroke-width="1.2"/><text x="534" y="109" class="label">Décompression</text><text x="534" y="134" class="small">Sortie LZW</text><text x="534" y="159" class="small">Ajouter le préfixe</text><rect x="763" y="80" width="210" height="104" rx="10" fill="#dcfce7" stroke="#64748b" stroke-width="1.2"/><text x="779" y="109" class="label">Schéma H</text><text x="779" y="134" class="small">Vérifier le checksum</text><text x="779" y="159" class="small">Tables et rubriques</text><path d="M 240 132 H 267" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M 485 132 H 512" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M 730 132 H 757" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="28" y="232" class="note">Les pointeurs du répertoire sont relatifs à H. Ils ne désignent pas des offsets du WDD stocké.</text>
</svg>
