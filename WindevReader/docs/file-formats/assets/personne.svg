<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc">
<title id="title">Un emplacement PERSONNE de 124 octets</title><desc id="desc">Les neuf premiers octets sont des métadonnées brutes. Les rubriques commencent à 9, 17, 68, 119 et 123. Les largeurs graphiques sont adaptées à la lisibilité, non proportionnelles.</desc>
<rect width="1000" height="340" rx="16" fill="#f8fafc"/>
<style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#15243b}.title{font-size:23px;font-weight:700}.label{font-size:17px;font-weight:650}.small{font-size:14px}.note{font-size:15px}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<text x="28" y="38" class="title">PERSONNE : 9 octets de gestion + 115 octets de valeurs</text><text x="28" y="70" class="note">Origine S = 1776 + indice × 124 ; indice de 0 à 4 dans ce témoin</text><rect x="28" y="102" width="160" height="112" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2"/><text x="44" y="131" class="label">Gestion</text><text x="44" y="156" class="small">+0 à +8</text><text x="44" y="181" class="small">9 octets bruts</text><rect x="195" y="102" width="165" height="112" rx="10" fill="#dbeafe" stroke="#64748b" stroke-width="1.2"/><text x="211" y="131" class="label">IDPERSONNE</text><text x="211" y="156" class="small">+9 à +16</text><text x="211" y="181" class="small">8 octets</text><rect x="367" y="102" width="165" height="112" rx="10" fill="#dcfce7" stroke="#64748b" stroke-width="1.2"/><text x="383" y="131" class="label">NOM</text><text x="383" y="156" class="small">+17 à +67</text><text x="383" y="181" class="small">50 + NUL</text><rect x="539" y="102" width="165" height="112" rx="10" fill="#ccfbf1" stroke="#64748b" stroke-width="1.2"/><text x="555" y="131" class="label">PRENOM</text><text x="555" y="156" class="small">+68 à +118</text><text x="555" y="181" class="small">50 + NUL</text><rect x="711" y="102" width="125" height="112" rx="10" fill="#fef3c7" stroke="#64748b" stroke-width="1.2"/><text x="727" y="131" class="label">AGE1</text><text x="727" y="156" class="small">+119</text><text x="727" y="181" class="small">4 octets</text><rect x="843" y="102" width="130" height="112" rx="10" fill="#fce7f3" stroke="#64748b" stroke-width="1.2"/><text x="859" y="131" class="label">FLAGADMIN</text><text x="859" y="156" class="small">+123</text><text x="859" y="181" class="small">1 octet</text><text x="28" y="254" class="note">Le schéma confirme les noms, types et tailles. Les états logiques restent inconnus.</text><text x="28" y="284" class="small">Largeurs graphiques adaptées à la lecture ; les intervalles chiffrés font foi.</text>
</svg>
