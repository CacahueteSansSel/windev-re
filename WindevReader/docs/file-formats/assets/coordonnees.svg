<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 325" role="img" aria-labelledby="title desc">
<title id="title">Offsets dans trois buffers</title><desc id="desc">Un offset absolu appartient au fichier F. Un offset de bloc peut être relatif à la section. Après décompression, H a sa propre origine.</desc>
<rect width="1000" height="325" rx="16" fill="#f8fafc"/>
<style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#15243b}.title{font-size:23px;font-weight:700}.label{font-size:17px;font-weight:650}.small{font-size:14px}.note{font-size:15px}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<text x="28" y="37" class="title">Toujours préciser l’origine de l’offset</text><rect x="28" y="70" width="285" height="130" rx="10" fill="#dbeafe" stroke="#64748b" stroke-width="1.2"/><text x="44" y="99" class="label">F : fichier stocké</text><text x="44" y="124" class="small">F[0] : signature PCS</text><text x="44" y="149" class="small">F[111] : section du WDD 28</text><text x="44" y="174" class="small">F[3427] : fin exclusive</text><rect x="358" y="70" width="285" height="130" rx="10" fill="#fef3c7" stroke="#64748b" stroke-width="1.2"/><text x="374" y="99" class="label">S : section stockée</text><text x="374" y="124" class="small">S[0] : préfixe de 4 octets</text><text x="374" y="149" class="small">S[4..] : octets transformés</text><text x="374" y="174" class="small">F = 111 + S, ici seulement</text><rect x="688" y="70" width="285" height="130" rx="10" fill="#dcfce7" stroke="#64748b" stroke-width="1.2"/><text x="704" y="99" class="label">H : schéma reconstruit</text><text x="704" y="124" class="small">H[0] : préfixe conservé</text><text x="704" y="149" class="small">H[653] : table PERSONNE</text><text x="704" y="174" class="small">H[6487] : fin exclusive</text><path d="M 314 131 H 351" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M 644 131 H 681" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="240" class="note">Entre S et H : transformation inverse, puis décompression LZW.</text><text x="30" y="270" class="note">Un pointeur H[653] s’applique à H : il ne désigne pas F[111 + 653].</text>
</svg>
