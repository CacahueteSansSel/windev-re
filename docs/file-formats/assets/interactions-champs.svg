<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title description">
  <title id="title">Parcours des paramètres d’interaction des champs WDW</title>
  <desc id="description">La visibilité est lue à R plus 40. Trois textes facultatifs conduisent à S, début de l’état. D’autres textes conduisent au libellé commun, puis au paramètre d’accès par Tab. Les chaînes non vides déplacent les offsets suivants.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#475569"/></marker>
  </defs>
  <rect width="1100" height="560" rx="16" fill="#f8fafc"/>
  <g font-family="system-ui, sans-serif" fill="#0f172a">
    <text x="30" y="40" font-size="23" font-weight="700">Trois paramètres indépendants, des positions calculées</text>
    <text x="30" y="68" font-size="15" fill="#475569">R : fin du nom encadré · positions dans le buffer décompressé · profils 28/29/31</text>
    <rect x="30" y="96" width="300" height="92" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <text x="48" y="124" font-size="17" font-weight="700">Visibilité à R + 40</text>
    <text x="48" y="151" font-size="15">u32 : 0 = faux, 1 = vrai</text>
    <text x="48" y="174" font-size="13" fill="#166534">Indépendante du mot d’état</text>
    <rect x="380" y="96" width="300" height="92" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="398" y="124" font-size="17" font-weight="700">État au repère S</text>
    <text x="398" y="151" font-size="15">u32 : 0 = actif, 1 = inactif</text>
    <text x="398" y="174" font-size="15">4 = grisé ; autre = inconnu</text>
    <rect x="730" y="96" width="340" height="92" rx="10" fill="#dbeafe" stroke="#2563eb"/>
    <text x="748" y="124" font-size="17" font-weight="700">Accès par Tab au repère T</text>
    <text x="748" y="151" font-size="15">u32 : 0 = faux, 1 = vrai</text>
    <text x="748" y="174" font-size="13" fill="#1e40af">Paramètre enregistré, pas focus effectif</text>
    <text x="30" y="227" font-size="17" font-weight="700">Construire les repères en parcourant les textes</text>
    <g stroke="#475569" stroke-width="2" marker-end="url(#arrow)" fill="none">
      <path d="M220 288 H260"/><path d="M480 288 H520"/><path d="M740 288 H780"/>
      <path d="M1040 327 V368 H250 V390"/><path d="M560 431 H610"/>
    </g>
    <rect x="30" y="250" width="190" height="78" rx="8" fill="white" stroke="#94a3b8"/>
    <text x="44" y="277" font-size="15">À partir de R + 44</text>
    <text x="44" y="301" font-size="15" font-weight="600">3 textes → S</text>
    <rect x="270" y="250" width="210" height="78" rx="8" fill="white" stroke="#94a3b8"/>
    <text x="284" y="277" font-size="15">État sur 4 octets</text>
    <text x="284" y="301" font-size="15" font-weight="600">Texte à S + 4 → Q</text>
    <rect x="530" y="250" width="210" height="78" rx="8" fill="white" stroke="#94a3b8"/>
    <text x="544" y="277" font-size="15">L = Q + 24 en 28/29</text>
    <text x="544" y="301" font-size="15" font-weight="600">L = Q + 28 en 31</text>
    <rect x="790" y="250" width="280" height="78" rx="8" fill="white" stroke="#94a3b8"/>
    <text x="804" y="277" font-size="15">Libellé commun à L</text>
    <text x="804" y="301" font-size="15" font-weight="600">Fin du texte ou de 00 → E</text>
    <rect x="100" y="390" width="460" height="80" rx="8" fill="white" stroke="#94a3b8"/>
    <text x="118" y="418" font-size="16">Parcourir le texte facultatif à E + 4</text>
    <text x="118" y="446" font-size="16" font-weight="600">Sa fin donne V ; le mot Tab est à T = V + 3</text>
    <rect x="620" y="390" width="450" height="80" rx="8" fill="#fff7ed" stroke="#ea580c"/>
    <text x="638" y="418" font-size="16" font-weight="600">Texte vide : 1 octet 00</text>
    <text x="638" y="446" font-size="15">Texte non vide : longueur encadrée complète</text>
    <text x="30" y="520" font-size="15" fill="#475569">Une forme inconnue arrête les lectures dépendantes. Les valeurs inconnues restent nulles, avec les mots bruts conservés.</text>
  </g>
</svg>
