<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<text x="28" y="38" class="title">Deux familles complémentaires</text><rect x="28" y="65" width="425" height="105" rx="10" fill="#dbeafe" stroke="#64748b" stroke-width="1.2"/><text x="44" y="94" class="label">WINDEV : descriptions du projet</text><text x="44" y="119" class="small">WDP · WDW · WDG · WDE · WDL</text><text x="44" y="144" class="small">Références, propriétés, code et ressources</text><rect x="28" y="202" width="425" height="110" rx="10" fill="#e0e7ff" stroke="#64748b" stroke-width="1.2"/><text x="44" y="231" class="label">WDD / WDA : analyse</text><text x="44" y="256" class="small">Tables, rubriques, types et liaisons</text><text x="44" y="281" class="small">Le WDD fournit le modèle typé</text><rect x="550" y="96" width="420" height="205" rx="10" fill="#dcfce7" stroke="#64748b" stroke-width="1.2"/><text x="566" y="125" class="label">HFSQL : fichiers physiques</text><text x="566" y="150" class="small">FIC : valeurs et gestion des emplacements</text><text x="566" y="175" class="small">NDX : structures d’index</text><text x="566" y="200" class="small">MMO : contenus variables</text><text x="566" y="225" class="small">Les GUID relient les fichiers à une table</text><path d="M 454 255 H 515 V 195 H 548" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="462" y="330" class="note">Association vérifiée par GUID ; décodage physique encore partiel</text>
