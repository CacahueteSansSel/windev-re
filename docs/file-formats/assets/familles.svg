<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 355" role="img" aria-labelledby="title desc">
<title id="title">Du projet aux valeurs physiques</title><desc id="desc">Les documents WINDEV décrivent le projet. Le WDD décrit le schéma. Les GUID associent le schéma aux fichiers physiques HFSQL.</desc>
